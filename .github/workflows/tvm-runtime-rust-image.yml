# Project release tags select the code; TVM and CUDA versions come from release-images.json.
name: tvm-runtime-rust release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Project release tag, for example 0.16.1
        type: string
        required: true
      publish:
        description: Publish images from the exact release tag
        type: boolean
        default: false
      manifest_run_id:
        description: Optional previous run ID to recover manifests without rebuilding
        type: string
        default: ''

concurrency:
  group: tvm-runtime-rust-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      cpu_tag: ${{ steps.resolve.outputs.cpu_tag }}
      cuda_tag: ${{ steps.resolve.outputs.cuda_tag }}
      tvm_version: ${{ steps.resolve.outputs.tvm_version }}
      ffi_version: ${{ steps.resolve.outputs.ffi_version }}
      tvm_commit: ${{ steps.resolve.outputs.tvm_commit }}
      ffi_commit: ${{ steps.resolve.outputs.ffi_commit }}
      cuda_version: ${{ steps.resolve.outputs.cuda_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve source tag and dependency versions
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          MANIFEST_RUN_ID: ${{ inputs.manifest_run_id }}
        run: |
          if [[ -n "$MANIFEST_RUN_ID" && ! "$MANIFEST_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid recovery run ID" >&2
            exit 1
          fi
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          python3 scripts/release-images.py resolve --release "$RELEASE_TAG" "${args[@]}"

      - uses: docker/login-action@v3
        if: (github.event_name == 'push' || inputs.publish) && (inputs.manifest_run_id || '') == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing image tags before building
        if: (github.event_name == 'push' || inputs.publish) && (inputs.manifest_run_id || '') == ''
        env:
          CPU_TAG: ${{ steps.resolve.outputs.cpu_tag }}
          CUDA_TAG: ${{ steps.resolve.outputs.cuda_tag }}
        run: |
          python3 scripts/check-image-tag.py "ghcr.io/scc-digitalhub/tvm-runtime-rust:$CPU_TAG" \
            "ghcr.io/scc-digitalhub/tvm-runtime-rust:$CUDA_TAG"
          for arch in amd64 arm64 armv7; do
            python3 scripts/check-image-tag.py "ghcr.io/scc-digitalhub/tvm-runtime-rust:$CPU_TAG-$arch"
          done
          for arch in amd64 arm64; do
            python3 scripts/check-image-tag.py "ghcr.io/scc-digitalhub/tvm-runtime-rust:$CUDA_TAG-$arch"
          done

  cpu:
    needs: release
    uses: ./.github/workflows/tvm-runtime-rust-cpu-build.yml
    with:
      release_tag: ${{ needs.release.outputs.release }}
      source_sha: ${{ needs.release.outputs.source_sha }}
      image_tag: ${{ needs.release.outputs.cpu_tag }}
      tvm_version: ${{ needs.release.outputs.tvm_version }}
      ffi_version: ${{ needs.release.outputs.ffi_version }}
      tvm_commit: ${{ needs.release.outputs.tvm_commit }}
      ffi_commit: ${{ needs.release.outputs.ffi_commit }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
      manifest_run_id: ${{ inputs.manifest_run_id || '' }}

  cuda:
    needs: release
    uses: ./.github/workflows/tvm-runtime-rust-cuda-image.yml
    with:
      release_tag: ${{ needs.release.outputs.release }}
      source_sha: ${{ needs.release.outputs.source_sha }}
      image_tag: ${{ needs.release.outputs.cuda_tag }}
      tvm_version: ${{ needs.release.outputs.tvm_version }}
      ffi_version: ${{ needs.release.outputs.ffi_version }}
      tvm_commit: ${{ needs.release.outputs.tvm_commit }}
      ffi_commit: ${{ needs.release.outputs.ffi_commit }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
      manifest_run_id: ${{ inputs.manifest_run_id || '' }}
