# Builds the exact source release selected by the TVM release workflow.
name: tvm-runtime-rust cuda build

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      tvm_version:
        type: string
        required: true
      ffi_version:
        type: string
        required: true
      tvm_commit:
        type: string
        required: true
      ffi_commit:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      manifest_run_id:
        type: string
        default: ''
    outputs:
      image_ref:
        description: Verified multi-architecture image digest
        value: ${{ jobs.manifest.outputs.image_ref }}

permissions:
  contents: read
  packages: write
  actions: read

env:
  IMAGE: ghcr.io/scc-digitalhub/tvm-runtime-rust
  CUDA_VERSION: "13.2.1"
  CUDA_BASE_IMAGE: nvidia/cuda:13.2.1-base-ubuntu24.04@sha256:7be56e69d8ae7c3648b8fca009fa35980ecd9c6eefaafbff3ee8c224e0043eb5
  RELEASE_VERSION: ${{ inputs.release_tag }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  TVM_VERSION: ${{ inputs.tvm_version }}
  TVM_FFI_VERSION: ${{ inputs.ffi_version }}
  TVM_GIT_COMMIT: ${{ inputs.tvm_commit }}
  TVM_FFI_GIT_COMMIT: ${{ inputs.ffi_commit }}
  EXPECTED_TVM_COMMIT: ${{ inputs.tvm_commit }}
  EXPECTED_FFI_COMMIT: ${{ inputs.ffi_commit }}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: inputs.manifest_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            elf_machine: Advanced Micro Devices X86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            elf_machine: AArch64
    runs-on: ${{ matrix.runner }}
    container:
      image: nvidia/cuda:13.2.1-devel-ubuntu24.04@sha256:44a9504c6dfb50b1241464241b02a93871928f373de6f5a644cf5fe9f080aa63
    timeout-minutes: 90
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      REF: ghcr.io/scc-digitalhub/tvm-runtime-rust:${{ inputs.image_tag }}-${{ matrix.arch }}
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git \
            cmake ninja-build python3 docker.io

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the pinned TVM runtime and CUDA plugin
        run: |
          src="$RUNNER_TEMP/tvm"
          build="$RUNNER_TEMP/tvm-build"
          git clone --depth 1 --branch "v$TVM_VERSION" https://github.com/apache/tvm "$src"
          test "$(git -C "$src" rev-parse HEAD)" = "$TVM_GIT_COMMIT"
          git -C "$src" submodule update --init --depth 1 3rdparty/tvm-ffi
          git -C "$src/3rdparty/tvm-ffi" submodule update --init --depth 1
          test "$(git -C "$src/3rdparty/tvm-ffi" rev-parse HEAD)" = "$TVM_FFI_GIT_COMMIT"
          cmake -S "$src" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DUSE_LLVM=OFF -DUSE_GTEST=OFF -DUSE_CUDA=/usr/local/cuda \
            -DCMAKE_CUDA_ARCHITECTURES=87 \
            -DCUDA_CUDA_LIBRARY=/usr/local/cuda/lib64/stubs/libcuda.so
          cmake --build "$build" --target tvm_runtime tvm_runtime_cuda --parallel 2
          for library in libtvm_runtime.so libtvm_ffi.so libtvm_runtime_cuda.so; do
            machine="$(readelf -h "$build/lib/$library" | sed -n 's/^ *Machine: *//p')"
            test "$machine" = "${{ matrix.elf_machine }}"
            if readelf -d "$build/lib/$library" | grep -E '(RPATH|RUNPATH).*stubs'; then
              echo "::error::driver stub path must not be embedded in $library"
              exit 1
            fi
          done
          # A driver stub is used only to link and exercise no-GPU behavior on CI.
          # It is never staged in the final image or a runtime loader search path.
          mkdir -p "$RUNNER_TEMP/driver-stubs"
          ln -s /usr/local/cuda/lib64/stubs/libcuda.so "$RUNNER_TEMP/driver-stubs/libcuda.so.1"
          {
            echo "TVM_SRC=$src"
            echo "TVM_BUILD=$build"
          } >> "$GITHUB_ENV"

      - name: Build and test the CUDA-enabled Rust server without a GPU
        run: |
          python3 scripts/test_verify_tvm_build.py
          ln -sfn "$TVM_SRC/3rdparty/tvm-ffi/rust" .tvm-ffi-rust
          gcc -shared -x c /dev/null -o "$TVM_BUILD/lib/libtvm_ffi_testing.so"
          export PATH="$GITHUB_WORKSPACE/scripts:$PATH"
          export TVM_BUILD_DIR="$TVM_BUILD" TVM_FFI_LIBDIR="$TVM_BUILD/lib"
          export LD_LIBRARY_PATH="$TVM_BUILD/lib:/usr/local/cuda/lib64:$RUNNER_TEMP/driver-stubs"
          export RUSTFLAGS="-C link-arg=-Wl,-rpath-link,$RUNNER_TEMP/driver-stubs -C link-arg=-Wl,-rpath-link,/usr/local/cuda/lib64"
          TVM_TEST_REQUIRE_NO_CUDA=1 cargo test --locked --release --features cuda -p tvm-relax -p tvm-serve
          cargo build --locked --release --features cuda --bin tvm-serve
          needed="$(readelf -d target/release/tvm-serve)"
          for library in libtvm_runtime.so libtvm_ffi.so libtvm_runtime_cuda.so; do
            grep -F "Shared library: [$library]" <<<"$needed" >/dev/null
          done
          if grep -E 'libtvm_ffi_testing|(RPATH|RUNPATH).*stubs' <<<"$needed"; then
            echo "::error::test dependencies leaked into tvm-serve"
            exit 1
          fi

      - name: Stage libraries and provenance
        run: |
          mkdir -p lib evidence
          cp "$TVM_BUILD/lib/libtvm_runtime.so" "$TVM_BUILD/lib/libtvm_ffi.so" \
            "$TVM_BUILD/lib/libtvm_runtime_cuda.so" lib/
          strip --strip-debug lib/*.so
          cp target/release/tvm-serve tvm-serve
          cp "$TVM_BUILD/CMakeCache.txt" evidence/cuda-CMakeCache.txt
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          libraries = {p.name: digest(p) for p in sorted(Path("lib").glob("*.so"))}
          manifest = {
              "schema_version": 1,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platform": os.environ["PLATFORM"],
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_git_commit": os.environ["SOURCE_SHA"],
              "release_version": os.environ["RELEASE_VERSION"],
              "build_recipe_git_commit": os.environ["GITHUB_SHA"],
              "image_tag": os.environ["IMAGE_TAG"],
              "tvm_version": os.environ["TVM_VERSION"],
              "tvm_git_commit": os.environ["TVM_GIT_COMMIT"],
              "tvm_ffi_version": os.environ["TVM_FFI_VERSION"],
              "tvm_ffi_git_commit": os.environ["TVM_FFI_GIT_COMMIT"],
              "compiled_backends": ["cpu", "cuda"],
              "cuda_version": os.environ["CUDA_VERSION"],
              "cuda_build": {
                  "tvm_git_commit": os.environ["TVM_GIT_COMMIT"],
                  "tvm_ffi_git_commit": os.environ["TVM_FFI_GIT_COMMIT"],
                  "build_target": "tvm_runtime_cuda",
                  "cuda_version": os.environ["CUDA_VERSION"],
                  "cmake_cache_sha256": digest(Path("evidence/cuda-CMakeCache.txt")),
                  "library_sha256": libraries["libtvm_runtime_cuda.so"],
              },
              "build_run": "{}/{}/actions/runs/{}".format(os.environ["GITHUB_SERVER_URL"],
                  os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]),
              "libraries": libraries,
          }
          Path("provenance.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Build and inspect runtime image
        run: |
          docker build --platform "$PLATFORM" -t "$REF" \
            --build-arg "BASE_IMAGE=$CUDA_BASE_IMAGE" --build-arg TVM_BACKEND=cuda \
            --build-arg "TVM_VERSION=$TVM_VERSION" --build-arg "TVM_GIT_COMMIT=$TVM_GIT_COMMIT" \
            --build-arg "TVM_FFI_VERSION=$TVM_FFI_VERSION" --build-arg "TVM_FFI_GIT_COMMIT=$TVM_FFI_GIT_COMMIT" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.digitalhub.cuda.version=$CUDA_VERSION" \
            --label "org.digitalhub.source.revision=$SOURCE_SHA" \
            --label "org.digitalhub.release.version=$RELEASE_VERSION" \
            --label "org.digitalhub.build.revision=$GITHUB_SHA" .
          test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$REF")" = "$PLATFORM"
          for library in libtvm_runtime.so libtvm_ffi.so libtvm_runtime_cuda.so; do
            want="$(sha256sum "lib/$library" | cut -d' ' -f1)"
            got="$(docker run --rm --entrypoint sha256sum "$REF" "/opt/tvm/lib/$library" | cut -d' ' -f1)"
            test "$want" = "$got"
          done
          docker run --rm --entrypoint /bin/sh "$REF" -ec '
            test ! -e /opt/tvm/lib/libcuda.so.1
            ! command -v python3
            ! command -v nvcc
            ! ldd /usr/local/bin/tvm-serve | grep "not found" | grep -v "libcuda.so.1 => not found"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: cuda-provenance-${{ matrix.arch }}
          path: |
            provenance.json
            evidence/cuda-CMakeCache.txt

      - if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push requested image
        if: inputs.publish
        run: |
          python3 scripts/check-image-tag.py "$REF"
          docker push "$REF"
          mkdir -p digests
          docker image inspect --format '{{json .RepoDigests}}' "$REF" > repo-digests.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          references = [value for value in json.loads(Path("repo-digests.json").read_text())
                        if re.fullmatch(re.escape(os.environ["IMAGE"]) + r"@sha256:[0-9a-f]{64}", value)]
          if len(references) != 1:
              raise SystemExit("Expected one image digest")
          Path("digests", os.environ["ARCH"] + ".txt").write_text(references[0] + "\n")
          PY

      - if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: cuda-image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Record verification limits
        run: |
          echo 'CUDA allocation, kernel execution and GPU numerical parity: NOT_RUN (no GPU on this runner).' >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime and no-GPU contract checks passed for $PLATFORM. Publication requested: ${{ inputs.publish }}." >> "$GITHUB_STEP_SUMMARY"

  manifest:
    needs: build
    if: ${{ always() && inputs.publish && (needs.build.result == 'success' || inputs.manifest_run_id != '') }}
    runs-on: ubuntu-24.04
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: cuda-image-digest-*
          path: digests
          merge-multiple: true
          run-id: ${{ inputs.manifest_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and publish exact image digests
        id: publish
        run: |
          python3 scripts/release-images.py manifest --release "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" --backend cuda --image "$IMAGE" \
            --tag "$IMAGE_TAG" --architectures amd64,arm64 --publish
